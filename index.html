<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS2 VIP Shop - Premium Market</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { 
            background: linear-gradient(135deg, #090d16 0%, #111827 50%, #1f2937 100%); 
            color: #f8fafc; 
            padding: 20px; 
            min-height: 100vh;
        }
        header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 25px; 
            border-bottom: 1px solid rgba(56, 189, 248, 0.2); 
            padding-bottom: 15px; 
            flex-wrap: wrap; 
            gap: 15px; 
        }
        h1 { color: #38bdf8; font-size: 26px; text-shadow: 0 0 10px rgba(56,189,248,0.3); }
        
        .user-panel { display: flex; align-items: center; gap: 12px; background: rgba(30, 41, 59, 0.8); padding: 10px 18px; border-radius: 10px; border: 1px solid rgba(56, 189, 248, 0.3); backdrop-filter: blur(5px); flex-wrap: wrap; }
        .balance { color: #22c55e; font-weight: bold; font-size: 18px; }
        .deposit-btn { background: #38bdf8; color: #000; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 14px; transition: 0.2s; }
        .deposit-btn:hover { background: #0ea5e9; }
        .admin-btn { background: linear-gradient(135deg, #eab308, #ca8a04); color: #000; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .admin-btn:hover { opacity: 0.9; transform: scale(1.05); }

        /* Trade Link qismi */
        .trade-section { background: rgba(30, 41, 59, 0.7); padding: 15px; border-radius: 10px; margin-bottom: 25px; border: 1px solid rgba(56, 189, 248, 0.2); display: flex; gap: 10px; align-items: center; backdrop-filter: blur(5px); }
        .trade-section input { flex: 1; padding: 12px; background: #0b0f19; border: 1px solid #334155; color: white; border-radius: 6px; outline: none; }
        .trade-section input:focus { border-color: #38bdf8; }
        .trade-section button { background: #38bdf8; color: #000; border: none; padding: 12px 20px; font-weight: bold; border-radius: 6px; cursor: pointer; transition: 0.2s; }
        .trade-section button:hover { background: #0ea5e9; }

        .container { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
        .card { 
            background: rgba(30, 41, 59, 0.6); 
            border-radius: 14px; 
            padding: 15px; 
            text-align: center; 
            border: 1px solid rgba(255, 255, 255, 0.05); 
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            transition: 0.3s; 
            backdrop-filter: blur(5px);
        }
        .card:hover { transform: translateY(-6px); border-color: #38bdf8; box-shadow: 0 8px 25px rgba(56,189,248,0.2); }
        .card img { width: 100%; height: 150px; object-fit: contain; margin-bottom: 10px; filter: drop-shadow(0 5px 5px rgba(0,0,0,0.5)); }
        .card h3 { font-size: 16px; margin-bottom: 5px; color: #e2e8f0; }
        .card p { color: #38bdf8; font-weight: bold; font-size: 17px; margin-bottom: 15px; }
        .buy-btn { background: linear-gradient(135deg, #22c55e, #16a34a); color: white; border: none; padding: 10px; width: 100%; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .buy-btn:hover { opacity: 0.9; transform: scale(1.02); }

        /* Modal */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 1000; backdrop-filter: blur(8px); }
        .modal-content { background: #1e293b; padding: 25px; border-radius: 14px; width: 380px; border: 1px solid #334155; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .modal-content h2 { margin-bottom: 15px; font-size: 20px; color: #38bdf8; }
        .modal-content p { font-size: 14px; margin-bottom: 12px; color: #cbd5e1; line-height: 1.5; }
        .modal-content input { width: 100%; padding: 10px; margin-bottom: 12px; background: #0f172a; border: 1px solid #334155; color: white; border-radius: 6px; outline: none; }
        .modal-content button { width: 100%; padding: 10px; background: #38bdf8; border: none; color: #000; font-weight: bold; border-radius: 6px; cursor: pointer; margin-top: 5px; }
        .close-btn { background: #ef4444 !important; color: white !important; }
        .card-info { background: #0f172a; padding: 10px; border-radius: 6px; border: 1px dashed #38bdf8; color: #38bdf8; font-family: monospace; font-size: 15px; margin-bottom: 15px; text-align: center; }
    </style>
</head>
<body>

    <header>
        <h1>⚡ CS2 VIP Shop</h1>
        <div class="user-panel">
            <span>Balans: <span class="balance" id="userBalance">$0.00</span></span>
            <button class="deposit-btn" onclick="openDeposit()">Hisobni to'ldirish</button>
            <button class="admin-btn" onclick="checkAdmin()">Admin Panel</button>
        </div>
    </header>

    <!-- Trade Link qismi -->
    <div class="trade-section">
        <input type="text" id="tradeLinkInput" placeholder="Steam Trade URL havolangizni kiriting...">
        <button onclick="saveTradeLink()">Saqlash</button>
    </div>

    <!-- Skinlar ro'yxati -->
    <div class="container" id="product-list"></div>

    <!-- Depozit (Pul tashlash) Modal oynasi -->
    <div class="modal" id="depositModal">
        <div class="modal-content">
            <h2>Balansni To'ldirish</h2>
            <p>Quyidagi kartaga pul o'tkazing va chekni adminga yuboring. Pul tushgach admin balansingizni to'ldiradi:</p>
            <div class="card-info">
                6262 5700 7572 5798<br>
                <strong>Ishkuvatova Risolat</strong>
            </div>
            <button class="close-btn" onclick="closeDeposit()">Yopish</button>
        </div>
    </div>

    <!-- Admin Panel Modal -->
    <div class="modal" id="adminModal">
        <div class="modal-content">
            <h2>Admin Panel</h2>
            <hr style="border:0; border-top:1px solid #334155; margin-bottom:15px;">
            
            <h3 style="font-size: 15px; color: #22c55e; margin-bottom: 8px;">Balans qo'shish</h3>
            <input type="number" id="addBalanceAmount" placeholder="Qo'shiladigan summa ($ da)">
            <button onclick="adminAddBalance()" style="background: #22c55e; color: white; margin-bottom: 20px;">Balansga qo'shish</button>

            <h3 style="font-size: 15px; color: #38bdf8; margin-bottom: 8px;">Yangi skin qo'shish</h3>
            <input type="text" id="skinName" placeholder="Skin nomi">
            <input type="number" id="skinPriceNum" placeholder="Narxi ($ da)">
            <input type="text" id="skinImg" placeholder="Rasm havolasi (URL)">
            <button onclick="addSkin()">Skin qo'shish</button>
            
            <button class="close-btn" onclick="closeAdmin()">Yopish</button>
        </div>
    </div>

    <script>
        let balance = 0.00;
        let tradeLink = "";

        let products = [
            { name: "AK-47 | Redline", price: 25.00, img: "https://community.cloudflare.steamstatic.com/economy/image/-9a81dlWLwJ2UUGcVs_nsVtzdOEdtWwKGZZLQHTxDZ7I56KU0Zwwo4NUX4oFJZEHLbXH5ApeO4YmlhxYQknCRvCo04DEVlxkKgpot7HxfDhjxszJemkV08-jq5WYh8j8J4Tdl3lW7Yt0jL2W89qh3lG2r0FsMGCgd4_DdwVsN1zRqFO_w-3r1MW9tc7Lz3JnvSA8ZCsjCq-P3-A/360fx360f" }
        ];

        function renderProducts() {
            const list = document.getElementById('product-list');
            list.innerHTML = "";
            products.forEach((p) => {
                list.innerHTML += `
                    <div class="card">
                        <img src="${p.img}" alt="${p.name}">
                        <h3>${p.name}</h3>
                        <p>$${p.price.toFixed(2)}</p>
                        <button class="buy-btn" onclick="buySkin('${p.name}', ${p.price})">Sotib olish</button>
                    </div>
                `;
            });
        }

        function updateBalanceUI() {
            document.getElementById('userBalance').innerText = "$" + balance.toFixed(2);
        }

        function saveTradeLink() {
            const link = document.getElementById('tradeLinkInput').value;
            if(link.trim() !== "") {
                tradeLink = link;
                alert("Trade Link muvaffaqiyatli saqlandi!");
            } else {
                alert("Iltimos, to'g'ri Trade Link kiriting!");
            }
        }

        function buySkin(name, price) {
            if(!tradeLink) {
                alert("Diqqat! Skinni olish uchun oldin Steam Trade Link havolangizni kiriting va saqlang.");
                return;
            }

            if(balance >= price) {
                balance -= price;
                updateBalanceUI();
                alert(`Tabriklayman! ${name} muvaffaqiyatli sotib olindi.\nTez orada Trade taklif yuboriladi!`);
            } else {
                alert("Xatolik: Balansingizda mablag' yetarli emas!");
            }
        }

        // Depozit oynasini ochish/yopish
        function openDeposit() { document.getElementById('depositModal').style.display = 'flex'; }
        function closeDeposit() { document.getElementById('depositModal').style.display = 'none'; }

        // Qiyinroq va maxfiy admin parol
        function checkAdmin() {
            let password = prompt("Admin maxfiy parolini kiriting:");
            if (password === "CS2_Vip_Secure_2026!") {
                document.getElementById('adminModal').style.display = 'flex';
            } else if (password !== null) {
                alert("Parol noto'g'ri!");
            }
        }

        function closeAdmin() { document.getElementById('adminModal').style.display = 'none'; }

        // Admin balans qo'shishi uchun funksiya
        function adminAddBalance() {
            let amount = parseFloat(document.getElementById('addBalanceAmount').value);
            if(!isNaN(amount) && amount > 0) {
                balance += amount;
                updateBalanceUI();
                alert(`Muvaffaqiyatli! Balansga $${amount.toFixed(2)} qo'shildi.`);
                document.getElementById('addBalanceAmount').value = '';
            } else {
                alert("To'g'ri summa kiriting!");
            }
        }

        function addSkin() {
            let name = document.getElementById('skinName').value;
            let price = parseFloat(document.getElementById('skinPriceNum').value);
            let img = document.getElementById('skinImg').value;

            if(name && !isNaN(price) && img) {
                products.push({ name, price, img });
                renderProducts();
                closeAdmin();
                document.getElementById('skinName').value = '';
                document.getElementById('skinPriceNum').value = '';
                document.getElementById('skinImg').value = '';
            } else {
                alert("Barcha maydonlarni to'g'ri to'ldiring!");
            }
        }

        renderProducts();
        updateBalanceUI();
    </script>
</body>
</html>
