<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS2 VIP Market | Premium Skins</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
        body { 
            background: radial-gradient(circle at top, #1e1b4b 0%, #0f172a 50%, #020617 100%); 
            color: #f8fafc; 
            padding: 25px; 
            min-height: 100vh;
        }
        header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 30px; 
            border-bottom: 1px solid rgba(56, 189, 248, 0.2); 
            padding-bottom: 20px; 
            flex-wrap: wrap; 
            gap: 20px; 
        }
        h1 { color: #38bdf8; font-size: 28px; font-weight: 800; letter-spacing: 0.5px; text-shadow: 0 0 20px rgba(56,189,248,0.4); display: flex; align-items: center; gap: 10px; }
        
        .user-panel { display: flex; align-items: center; gap: 15px; background: rgba(30, 41, 59, 0.7); padding: 10px 20px; border-radius: 12px; border: 1px solid rgba(56, 189, 248, 0.3); backdrop-filter: blur(10px); flex-wrap: wrap; box-shadow: 0 8px 32px rgba(0,0,0,0.3); }
        .balance { color: #4ade80; font-weight: bold; font-size: 18px; text-shadow: 0 0 10px rgba(74,222,128,0.3); }
        
        /* Google Login Button Style */
        .google-btn { background: #ffffff; color: #1e293b; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 8px; transition: 0.3s; box-shadow: 0 4px 12px rgba(255,255,255,0.1); }
        .google-btn:hover { background: #f1f5f9; transform: translateY(-2px); }
        .google-btn img { width: 16px; height: 16px; }

        .deposit-btn { background: #38bdf8; color: #020617; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: 700; font-size: 14px; transition: 0.3s; }
        .deposit-btn:hover { background: #0ea5e9; transform: translateY(-2px); }
        
        .admin-btn { background: linear-gradient(135deg, #eab308, #ca8a04); color: #000; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: 700; font-size: 14px; transition: 0.3s; }
        .admin-btn:hover { opacity: 0.9; transform: translateY(-2px); }

        /* Trade Link qismi */
        .trade-section { background: rgba(30, 41, 59, 0.5); padding: 18px; border-radius: 12px; margin-bottom: 30px; border: 1px solid rgba(56, 189, 248, 0.2); display: flex; gap: 12px; align-items: center; backdrop-filter: blur(10px); box-shadow: 0 8px 32px rgba(0,0,0,0.2); }
        .trade-section input { flex: 1; padding: 12px 16px; background: rgba(15, 23, 42, 0.8); border: 1px solid #334155; color: white; border-radius: 8px; outline: none; font-size: 14px; transition: 0.3s; }
        .trade-section input:focus { border-color: #38bdf8; box-shadow: 0 0 10px rgba(56,189,248,0.2); }
        .trade-section button { background: #38bdf8; color: #020617; border: none; padding: 12px 24px; font-weight: 700; border-radius: 8px; cursor: pointer; transition: 0.3s; }
        .trade-section button:hover { background: #0ea5e9; transform: translateY(-2px); }

        .container { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; }
        .card { 
            background: rgba(30, 41, 59, 0.4); 
            border-radius: 16px; 
            padding: 20px; 
            text-align: center; 
            border: 1px solid rgba(255, 255, 255, 0.05); 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1); 
            backdrop-filter: blur(10px);
        }
        .card:hover { transform: translateY(-8px); border-color: rgba(56, 189, 248, 0.5); box-shadow: 0 20px 40px rgba(56,189,248,0.15); }
        .card img { width: 100%; height: 160px; object-fit: contain; margin-bottom: 15px; filter: drop-shadow(0 8px 12px rgba(0,0,0,0.6)); transition: 0.3s; }
        .card:hover img { transform: scale(1.05); }
        .card h3 { font-size: 17px; margin-bottom: 8px; color: #f1f5f9; font-weight: 600; }
        .card p { color: #38bdf8; font-weight: 800; font-size: 19px; margin-bottom: 18px; text-shadow: 0 0 10px rgba(56,189,248,0.2); }
        .buy-btn { background: linear-gradient(135deg, #22c55e, #16a34a); color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; cursor: pointer; font-weight: 700; font-size: 15px; transition: 0.3s; box-shadow: 0 4px 15px rgba(34,197,94,0.3); }
        .buy-btn:hover { opacity: 0.95; transform: translateY(-2px); box-shadow: 0 6px 20px rgba(34,197,94,0.4); }

        /* Modal design */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(2, 6, 23, 0.85); justify-content: center; align-items: center; z-index: 1000; backdrop-filter: blur(12px); animation: fadeIn 0.3s ease; }
        .modal-content { background: #1e293b; padding: 30px; border-radius: 20px; width: 400px; border: 1px solid rgba(56, 189, 248, 0.3); box-shadow: 0 25px 50px rgba(0,0,0,0.7); }
        .modal-content h2 { margin-bottom: 15px; font-size: 22px; color: #38bdf8; font-weight: 700; }
        .modal-content p { font-size: 14px; margin-bottom: 15px; color: #94a3b8; line-height: 1.6; }
        .modal-content input { width: 100%; padding: 12px 16px; margin-bottom: 15px; background: #0f172a; border: 1px solid #334155; color: white; border-radius: 8px; outline: none; font-size: 14px; }
        .modal-content input:focus { border-color: #38bdf8; }
        .modal-content button { width: 100%; padding: 12px; background: #38bdf8; border: none; color: #020617; font-weight: 700; border-radius: 8px; cursor: pointer; margin-top: 5px; transition: 0.3s; }
        .modal-content button:hover { opacity: 0.9; }
        .close-btn { background: #ef4444 !important; color: white !important; }
        .card-info { background: #0f172a; padding: 15px; border-radius: 10px; border: 1px dashed #38bdf8; color: #38bdf8; font-family: monospace; font-size: 16px; margin-bottom: 20px; text-align: center; line-height: 1.6; }
    </style>
</head>
<body>

    <header>
        <h1>⚡ CS2 VIP Shop</h1>
        <div class="user-panel" id="userPanel">
            <!-- Google orqali kirish tugmasi (boshlanishiga chiqib turadi) -->
            <button class="google-btn" onclick="loginWithGoogle()">
                <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google"> Google bilan kirish
            </button>
            <button class="deposit-btn" onclick="openDeposit()">Hisobni to'ldirish</button>
            <button class="admin-btn" onclick="checkAdmin()">Admin Panel</button>
        </div>
    </header>

    <!-- Trade Link qismi -->
    <div class="trade-section">
        <input type="text" id="tradeLinkInput" placeholder="Steam Trade URL havolangizni kiriting...">
        <button onclick="saveTradeLink()">Saqlash</button>
    </div>

    <!-- Skinlar ro'yxati -->
    <div class="container" id="product-list"></div>

    <!-- Depozit Modal -->
    <div class="modal" id="depositModal">
        <div class="modal-content">
            <h2>Balansni To'ldirish</h2>
            <p>Quyidagi kartaga pul o'tkazing va chekni adminga yuboring. Pul tushgach admin balansingizni to'ldiradi:</p>
            <div class="card-info">
                6262 5700 7572 5798<br>
                <strong>Ishkuvatova Risolat</strong>
            </div>
            <button class="close-btn" onclick="closeDeposit()">Yopish</button>
        </div>
    </div>

    <!-- Admin Panel Modal -->
    <div class="modal" id="adminModal">
        <div class="modal-content">
            <h2>Admin Panel</h2>
            <hr style="border:0; border-top:1px solid #334155; margin: 15px 0;">
            
            <h3 style="font-size: 15px; color: #4ade80; margin-bottom: 8px;">Foydalanuvchiga balans qo'shish</h3>
            <input type="number" id="addBalanceAmount" placeholder="Qo'shiladigan summa ($ da)">
            <button onclick="adminAddBalance()" style="background: #22c55e; color: white; margin-bottom: 20px;">Balansga qo'shish</button>

            <h3 style="font-size: 15px; color: #38bdf8; margin-bottom: 8px;">Yangi skin qo'shish</h3>
            <input type="text" id="skinName" placeholder="Skin nomi">
            <input type="number" id="skinPriceNum" placeholder="Narxi ($ da)">
            <input type="text" id="skinImg" placeholder="Rasm havolasi (URL)">
            <button onclick="addSkin()">Skin qo'shish</button>
            
            <button class="close-btn" onclick="closeAdmin()">Yopish</button>
        </div>
    </div>

    <script>
        let balance = 0.00;
        let tradeLink = "";
        let userName = "";

        let products = [
            { name: "AK-47 | Redline", price: 25.00, img: "https://community.cloudflare.steamstatic.com/economy/image/-9a81dlWLwJ2UUGcVs_nsVtzdOEdtWwKGZZLQHTxDZ7I56KU0Zwwo4NUX4oFJZEHLbXH5ApeO4YmlhxYQknCRvCo04DEVlxkKgpot7HxfDhjxszJemkV08-jq5WYh8j8J4Tdl3lW7Yt0jL2W89qh3lG2r0FsMGCgd4_DdwVsN1zRqFO_w-3r1MW9tc7Lz3JnvSA8ZCsjCq-P3-A/360fx360f" }
        ];

        function renderProducts() {
            const list = document.getElementById('product-list');
            list.innerHTML = "";
            products.forEach((p) => {
                list.innerHTML += `
                    <div class="card">
                        <img src="${p.img}" alt="${p.name}">
                        <h3>${p.name}</h3>
                        <p>$${p.price.toFixed(2)}</p>
                        <button class="buy-btn" onclick="buySkin('${p.name}', ${p.price})">Sotib olish</button>
                    </div>
                `;
            });
        }

        function updatePanelUI() {
            const panel = document.getElementById('userPanel');
            if (userName) {
                panel.innerHTML = `
                    <span style="color: #38bdf8; font-weight: 600;">👤 ${userName}</span>
                    <span>Balans: <span class="balance">$${balance.toFixed(2)}</span></span>
                    <button class="deposit-btn" onclick="openDeposit()">To'ldirish</button>
                    <button class="admin-btn" onclick="checkAdmin()">Admin</button>
                `;
            }
        }

        // Google orqali kirishni simulyatsiya qilish (Ism kiritish yoki Google accountni tanlash)
        function loginWithGoogle() {
            let name = prompt("GoogleProfilingiz nomini kiriting (yoki ismingizni yozing):");
            if (name && name.trim() !== "") {
                userName = name.trim();
                updatePanelUI();
                alert(`Xush kelibsiz, ${userName}! Google orqali muvaffaqiyatli kirdingiz.`);
            }
        }

        function saveTradeLink() {
            const link = document.getElementById('tradeLinkInput').value;
            if(link.trim() !== "") {
                tradeLink = link;
                alert("Trade Link muvaffaqiyatli saqlandi!");
            } else {
                alert("Iltimos, to'g'ri Trade Link kiriting!");
            }
        }

        function buySkin(name, price) {
            if(!userName) {
                alert("Diqqat! Sotib olish uchun oldin 'Google bilan kirish' tugmasini bosing.");
                return;
            }
            if(!tradeLink) {
                alert("Diqqat! Skinni olish uchun oldin Steam Trade Link havolangizni kiriting va saqlang.");
                return;
            }

            if(balance >= price) {
                balance -= price;
                updatePanelUI();
                alert(`Tabriklayman ${userName}! ${name} muvaffaqiyatli sotib olindi.\nTez orada Trade taklif yuboriladi!`);
            } else {
                alert("Xatolik: Balansingizda mablag' yetarli emas! Iltimos hisobni to'ldiring.");
            }
        }

        function openDeposit() { document.getElementById('depositModal').style.display = 'flex'; }
        function closeDeposit() { document.getElementById('depositModal').style.display = 'none'; }

        // Maxfiy admin parol
        function checkAdmin() {
            let password = prompt("Admin maxfiy parolini kiriting:");
            if (password === "CS2_Vip_Secure_2026!") {
                document.getElementById('adminModal').style.display = 'flex';
            } else if (password !== null) {
                alert("Parol noto'g'ri!");
            }
        }

        function closeAdmin() { document.getElementById('adminModal').style.display = 'none'; }

        function adminAddBalance() {
            let amount = parseFloat(document.getElementById('addBalanceAmount').value);
            if(!isNaN(amount) && amount > 0) {
                balance += amount;
                updatePanelUI();
                alert(`Muvaffaqiyatli! Balansga $${amount.toFixed(2)} qo'shildi.`);
                document.getElementById('addBalanceAmount').value = '';
            } else {
                alert("To'g'ri summa kiriting!");
            }
        }

        function addSkin() {
            let name = document.getElementById('skinName').value;
            let price = parseFloat(document.getElementById('skinPriceNum').value);
            let img = document.getElementById('skinImg').value;

            if(name && !isNaN(price) && img) {
                products.push({ name, price, img });
                renderProducts();
                closeAdmin();
                document.getElementById('skinName').value = '';
                document.getElementById('skinPriceNum').value = '';
                document.getElementById('skinImg').value = '';
            } else {
                alert("Barcha maydonlarni to'g'ri to'ldiring!");
            }
        }

        renderProducts();
    </script>
</body>
</html>
