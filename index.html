<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS2 VIP Shop</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; padding: 20px; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 1px solid #334155; padding-bottom: 15px; flex-wrap: wrap; gap: 15px; }
        h1 { color: #38bdf8; font-size: 24px; }
        
        .user-panel { display: flex; align-items: center; gap: 15px; background: #1e293b; padding: 10px 15px; border-radius: 8px; border: 1px solid #334155; }
        .balance { color: #22c55e; font-weight: bold; font-size: 18px; }
        .admin-btn { background: #eab308; color: #000; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .admin-btn:hover { background: #ca8a04; }

        /* Trade Link qismi */
        .trade-section { background: #1e293b; padding: 15px; border-radius: 8px; margin-bottom: 25px; border: 1px solid #334155; display: flex; gap: 10px; align-items: center; }
        .trade-section input { flex: 1; padding: 10px; background: #0f172a; border: 1px solid #334155; color: white; border-radius: 6px; }
        .trade-section button { background: #38bdf8; color: #000; border: none; padding: 10px 20px; font-weight: bold; border-radius: 6px; cursor: pointer; }

        .container { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
        .card { background: #1e293b; border-radius: 12px; padding: 15px; text-align: center; border: 1px solid #334155; transition: 0.3s; }
        .card:hover { transform: translateY(-5px); border-color: #38bdf8; }
        .card img { width: 100%; height: 140px; object-fit: contain; margin-bottom: 10px; }
        .card h3 { font-size: 16px; margin-bottom: 5px; }
        .card p { color: #38bdf8; font-weight: bold; margin-bottom: 15px; }
        .buy-btn { background: #22c55e; color: white; border: none; padding: 10px; width: 100%; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .buy-btn:hover { background: #16a34a; }

        /* Modal */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); justify-content: center; align-items: center; }
        .modal-content { background: #1e293b; padding: 25px; border-radius: 12px; width: 350px; border: 1px solid #334155; }
        .modal-content h2 { margin-bottom: 15px; font-size: 20px; color: #38bdf8; }
        .modal-content input { width: 100%; padding: 10px; margin-bottom: 10px; background: #0f172a; border: 1px solid #334155; color: white; border-radius: 6px; }
        .modal-content button { width: 100%; padding: 10px; background: #38bdf8; border: none; color: #000; font-weight: bold; border-radius: 6px; cursor: pointer; }
        .close-btn { background: #ef4444 !important; color: white !important; margin-top: 5px; }
    </style>
</head>
<body>

    <header>
        <h1>⚡ CS2 VIP Shop</h1>
        <div class="user-panel">
            <span>Balans: <span class="balance" id="userBalance">$500.00</span></span>
            <button class="admin-btn" onclick="openAdmin()">Admin Panel</button>
        </div>
    </header>

    <!-- Trade Link kiritish -->
    <div class="trade-section">
        <input type="text" id="tradeLinkInput" placeholder="Steam Trade URL havolangizni kiriting...">
        <button onclick="saveTradeLink()">Saqlash</button>
    </div>

    <!-- Skinlar ro'yxati -->
    <div class="container" id="product-list"></div>

    <!-- Admin Panel Modal -->
    <div class="modal" id="adminModal">
        <div class="modal-content">
            <h2>Yangi Skin Qo'shish</h2>
            <input type="text" id="skinName" placeholder="Skin nomi">
            <input type="number" id="skinPriceNum" placeholder="Narxi ($ da, masalan: 120)">
            <input type="text" id="skinImg" placeholder="Rasm havolasi (URL)">
            <button onclick="addSkin()">Qo'shish</button>
            <button class="close-btn" onclick="closeAdmin()">Yopish</button>
        </div>
    </div>

    <script>
        // Foydalanuvchi balansi va saqlangan trade link
        let balance = 500.00;
        let tradeLink = "";

        let products = [
            { name: "★ Karambit | Doppler", price: 450.00, img: "https://community.cloudflare.steamstatic.com/economy/image/-9a81dlWLwJ2UUGcVs_nsVtzdOEdtWwKGZZLQHTxDZ7I56KU0Zwwo4NUX4oFJZEHLbXH5ApeO4YmlhxYQknCRvCo04DEVlxkKgpovb-Sv1Jz3u33eTxS_9mkgL-OmuLwNoTdl3lW7Yt0jeH--NunkwXgrRBsN2v2d9SWcw9qZwvU81G6yOm-jJLu7p6an3MwvXE8ZCsj2wQz/360fx360f" },
            { name: "AK-47 | Vulcan", price: 120.00, img: "https://community.cloudflare.steamstatic.com/economy/image/-9a81dlWLwJ2UUGcVs_nsVtzdOEdtWwKGZZLQHTxDZ7I56KU0Zwwo4NUX4oFJZEHLbXH5ApeO4YmlhxYQknCRvCo04DEVlxkKgpot7HxfDhjxszJemkV08-jq5WYh8j8J4Tdl3lW7Yt0jL2W89qh3lG2r0FsMGCgd4_DdwVsN1zRqFO_w-3r1MW9tc7Lz3JnvSA8ZCsjCq-P3-A/360fx360f" },
            { name: "M4A4 | Asiimov", price: 85.00, img: "https://community.cloudflare.steamstatic.com/economy/image/-9a81dlWLwJ2UUGcVs_nsVtzdOEdtWwKGZZLQHTxDZ7I56KU0Zwwo4NUX4oFJZEHLbXH5ApeO4YmlhxYQknCRvCo04DEVlxkKgpou-6kejhz2v_Nfz5H_uO1gb-Gw_alIITBhGBU_MZZjOvA89jziwewrhBmZj2hd9STdVA8ZwnXr1jll7--gpC9upvLnXE37iQm5nvfmhe20ktOceVxx6W-O06cQasbOg/360fx360f" }
        ];

        function renderProducts() {
            const list = document.getElementById('product-list');
            list.innerHTML = "";
            products.forEach((p) => {
                list.innerHTML += `
                    <div class="card">
                        <img src="${p.img}" alt="${p.name}">
                        <h3>${p.name}</h3>
                        <p>$${p.price.toFixed(2)}</p>
                        <button class="buy-btn" onclick="buySkin('${p.name}', ${p.price})">Sotib olish</button>
                    </div>
                `;
            });
        }

        function updateBalanceUI() {
            document.getElementById('userBalance').innerText = "$" + balance.toFixed(2);
        }

        function saveTradeLink() {
            const link = document.getElementById('tradeLinkInput').value;
            if(link.trim() !== "") {
                tradeLink = link;
                alert("Trade Link muvaffaqiyatli saqlandi!");
            } else {
                alert("Iltimos, to'g'ri Trade Link kiriting!");
            }
        }

        function buySkin(name, price) {
            if(!tradeLink) {
                alert("Diqqat! Skinni olish uchun oldin Steam Trade Link havolangizni kiriting va saqlang.");
                return;
            }

            if(balance >= price) {
                balance -= price;
                updateBalanceUI();
                alert(`Tabriklayman! ${name} muvaffaqiyatli sotib olindi.\nTez orada Trade taklif yuboriladi!`);
            } else {
                alert("Xatolik: Balansingizda mablag' yetarli emas!");
            }
        }

        function openAdmin() { document.getElementById('adminModal').style.display = 'flex'; }
        function closeAdmin() { document.getElementById('adminModal').style.display = 'none'; }

        function addSkin() {
            let name = document.getElementById('skinName').value;
            let price = parseFloat(document.getElementById('skinPriceNum').value);
            let img = document.getElementById('skinImg').value;

            if(name && !isNaN(price) && img) {
                products.push({ name, price, img });
                renderProducts();
                closeAdmin();
                document.getElementById('skinName').value = '';
                document.getElementById('skinPriceNum').value = '';
                document.getElementById('skinImg').value = '';
            } else {
                alert("Barcha maydonlarni to'g'ri to'ldiring!");
            }
        }

        renderProducts();
        updateBalanceUI();
    </script>
</body>
</html>
